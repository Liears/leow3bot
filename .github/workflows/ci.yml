# CI 门禁：typecheck + 全量测试（vitest unit/integration + E2E）+ 构建
# 配合分支保护将本 job 设为 required check（Settings → Branches → master）
# E2E 在 runner 上原生可跑：mock LLM 服务器（node:http）+ script(1) PTY 驱动真进程，
# 零外部网络依赖（LLM 请求全部打到 127.0.0.1 的 mock）。

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# 同一 PR / 分支的新推送取消旧跑，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + test + build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # vitest(unit/integration) + E2E（mock LLM + PTY 真进程）
      - name: Tests
        run: npx vitest run && npm run test:e2e

      - name: Build
        run: npm run build
