# CI：push / PR 自动全量测试（typecheck + vitest unit/integration + E2E）。
# E2E 在 runner 上原生可跑：mock LLM 服务器（node:http）+ script(1) PTY 驱动真进程，
# 零外部网络依赖（LLM 请求全部打到 127.0.0.1 的 mock）。

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: vitest（unit + integration）
        run: npx vitest run

      - name: E2E（mock LLM + PTY 真进程）
        run: npm run test:e2e
